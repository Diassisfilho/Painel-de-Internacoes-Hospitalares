[project]
name = "dashboard-saude-ocara-ce"
version = "0.1.0"
description = "Dashboard interativo de indicadores de saúde pública do município de Ocara/CE, com dados do DATASUS."
requires-python = ">=3.12, <3.14"
dependencies = [
    "streamlit",
    "pandas",
    "plotly",
    "pysus",
]

[project.scripts]
extrator = "src.extrator_datasus:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
omit = ["src/__pycache__/*", "tests/*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
