name: Atualizar Dados do DATASUS (2x por mês)

on:
  schedule:
    # Duas vezes por mês: dias 1 e 15 às 03:00 UTC (00:00 BRT) - busca na base PySUS
    - cron: '0 3 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair_dados:
    runs-on: ubuntu-latest
    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6

      - name: Instalar dependências
        run: uv sync

      - name: Executar script de extração (PySUS)
        run: uv run python src/extrator_datasus.py

      - name: Verificar e exibir log gerado
        run: |
          echo "=== Log da atualização ==="
          cat dados/ultima_atualizacao.json || echo "Log não encontrado"
          echo "=== CSV ==="
          wc -l dados/internacoes_ocara.csv || echo "CSV não encontrado"
          ls -lh dados/

      - name: Fazer commit e push dos novos dados e log
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add dados/internacoes_ocara.csv dados/ultima_atualizacao.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update automático de dados do DATASUS (2x/mês via PySUS)" && git push)